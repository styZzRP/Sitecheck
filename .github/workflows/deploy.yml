name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - claude/checkvibe-clone-ysamjq
  workflow_dispatch:

# Prevent overlapping deploys of the same branch.
concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build for Cloudflare Pages
        run: npm run pages:build

      # Create the Pages project on the first run. If it already exists,
      # wrangler exits non-zero and we simply continue.
      - name: Ensure Pages project exists
        run: |
          npx wrangler pages project create sitecheck --production-branch=main \
            || echo "Project 'sitecheck' already exists (or create was skipped) — continuing."

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy --branch=main --commit-dirty=true
